<svg xmlns="http://www.w3.org/2000/svg" width="860" height="180" viewBox="0 0 860 180" role="img" aria-label="Blood Oath: Brazil 1898, an open-world Roblox game set in the sertão">
<title>Blood Oath: Brazil 1898</title>
<style>
.ti{font:700 31px Georgia,'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua','Times New Roman',serif;fill:#2b2118}
.sub{font:400 15px Georgia,'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua','Times New Roman',serif;fill:#6b5a45}
.eb{font:600 12px Georgia,'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua','Times New Roman',serif;fill:#8e1b12;letter-spacing:3px}
.au{transform-box:fill-box;transform-origin:center;animation:au 12s ease-in-out infinite alternate}
@keyframes au{0%{opacity:.5;transform:translateX(-20px) scale(.92)}100%{opacity:1;transform:translateX(26px) scale(1.08)}}
.sun{transform-box:fill-box;transform-origin:center;animation:sun 7s ease-in-out infinite alternate}
@keyframes sun{0%{opacity:.75;transform:scale(.94)}100%{opacity:1;transform:scale(1.06)}}
.du{animation:du linear infinite}
@keyframes du{0%{transform:translateX(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateX(-190px);opacity:0}}
.hz{animation:hz 16s ease-in-out infinite alternate}
@keyframes hz{0%{transform:translateX(30px)}100%{transform:translateX(-30px)}}
.mt{font:italic 400 9px Georgia,'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua','Times New Roman',serif;fill:#4e3420;fill-opacity:.75}
.cp{transform-box:fill-box;transform-origin:center;animation:cp 30s linear infinite}
@keyframes cp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf7ee"/><stop offset="1" stop-color="#f2e9d6"/></linearGradient>
<pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#3a2614" fill-opacity=".08"/></pattern>
<radialGradient id="glow"><stop offset="0" stop-color="#c6966c" stop-opacity=".28"/><stop offset="1" stop-color="#c6966c" stop-opacity="0"/></radialGradient>
<clipPath id="card"><rect width="860" height="180" rx="18"/></clipPath>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2e6c9"/><stop offset=".7" stop-color="#e5c99a"/><stop offset="1" stop-color="#d7aa72"/></linearGradient>
<radialGradient id="sg"><stop offset="0" stop-color="#b3261e" stop-opacity=".7"/><stop offset="1" stop-color="#b3261e" stop-opacity="0"/></radialGradient>
<radialGradient id="dh"><stop offset="0" stop-color="#a8764e" stop-opacity=".45"/><stop offset="1" stop-color="#a8764e" stop-opacity="0"/></radialGradient>
<radialGradient id="vg" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#a8764e" stop-opacity="0"/><stop offset="1" stop-color="#a8764e" stop-opacity=".55"/></radialGradient>
<pattern id="grain" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".6" fill="#4e3420" fill-opacity=".12"/><circle cx="4.5" cy="4" r=".5" fill="#4e3420" fill-opacity=".08"/></pattern>
<clipPath id="pn"><rect x="492" y="20" width="344" height="140" rx="12"/></clipPath>
</defs>
<g clip-path="url(#card)">
<rect width="860" height="180" rx="18" fill="url(#bg)"/>
<rect width="860" height="180" fill="url(#dots)"/>
<ellipse class="au" cx="150" cy="70" rx="260" ry="130" fill="url(#glow)"/>
</g>
<rect x=".5" y=".5" width="859" height="179" rx="17.5" fill="none" stroke="rgba(120,88,58,.25)"/>
