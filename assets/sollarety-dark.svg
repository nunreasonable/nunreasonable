<svg xmlns="http://www.w3.org/2000/svg" width="860" height="180" viewBox="0 0 860 180" role="img" aria-label="Sollarety: a Discord bot for community servers">
<title>Sollarety</title>
<style>
.spin{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
.spin-r{animation:spin 28s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 6s ease-in-out infinite alternate}
@keyframes pulse{0%{opacity:.6;transform:scale(.92)}100%{opacity:1;transform:scale(1.06)}}
.wm{font:700 64px 'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;letter-spacing:10px}
.sub{font:400 15px 'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;fill:#9aa0a9;letter-spacing:.5px}
.sh{transform:translateX(-240px);animation:sh 7s cubic-bezier(.45,0,.25,1) infinite}
@keyframes sh{0%,10%{transform:translateX(-240px)}60%,100%{transform:translateX(660px)}}
.eb{font:600 12px 'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;fill:#9aa0a9;letter-spacing:3px}
.au{transform-box:fill-box;transform-origin:center;animation:au 12s ease-in-out infinite alternate}
@keyframes au{0%{opacity:.5;transform:translateX(-20px)}100%{opacity:1;transform:translateX(30px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#050506"/><stop offset="1" stop-color="#101115"/></linearGradient>
<pattern id="sdots" width="14" height="14" patternUnits="userSpaceOnUse">
<circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity=".06"/></pattern>
<radialGradient id="sglowA"><stop offset="0" stop-color="#c9ced6" stop-opacity=".28"/><stop offset="1" stop-color="#c9ced6" stop-opacity="0"/></radialGradient>
<radialGradient id="sglowB"><stop offset="0" stop-color="#6c7078" stop-opacity=".28"/><stop offset="1" stop-color="#6c7078" stop-opacity="0"/></radialGradient>
<clipPath id="scard"><rect width="860" height="180" rx="18"/></clipPath>
<linearGradient id="ray" x1=".5" y1="0" x2=".5" y2="1"><stop offset="0" stop-color="#e9ecf1"/><stop offset="1" stop-color="#9ba0a9"/></linearGradient>
<linearGradient id="sph" x1=".18" y1=".08" x2=".82" y2=".95"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#c9ced6"/><stop offset="1" stop-color="#6c7078"/></linearGradient>
<linearGradient id="wmg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e4e7ec"/><stop offset="1" stop-color="#80858e"/></linearGradient>
<linearGradient id="shg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset=".5" stop-color="#ffffff" stop-opacity="0.95"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
<clipPath id="wmc"><text class="wm" x="210" y="112" textLength="440" lengthAdjust="spacing">SOLLARETY</text></clipPath>
</defs>
<g clip-path="url(#scard)">
<rect width="860" height="180" rx="18" fill="url(#sbg)"/>
<rect width="860" height="180" fill="url(#sdots)"/>
<ellipse class="au" cx="110" cy="90" rx="230" ry="130" fill="url(#sglowB)"/>
<ellipse class="au" cx="780" cy="150" rx="200" ry="110" fill="url(#sglowB)" style="animation-delay:-6s"/>
<ellipse class="pulse" cx="110" cy="90" rx="90" ry="90" fill="url(#sglowA)"/>
</g>
<rect x=".5" y=".5" width="859" height="179" rx="17.5" fill="none" stroke="#ffffff" stroke-opacity=".12"/>
<g transform="translate(40 20) scale(.35)">
<g fill="none" stroke="#ffffff" stroke-opacity=".1"><circle cx="200" cy="200" r="192"/><circle cx="200" cy="200" r="168"/><circle cx="200" cy="200" r="146"/></g>
<g class="spin"><ellipse cx="200" cy="200" rx="190" ry="80" transform="rotate(-16 200 200)" fill="none" stroke="#ffffff" stroke-opacity=".28" stroke-width="2"/>
<circle cx="18" cy="147" r="6.5" fill="#ffffff" fill-opacity=".9"/><circle cx="382" cy="253" r="9" fill="#ffffff"/></g>
<g class="spin spin-r" fill="url(#ray)"><polygon points="200,34 221.2,104.3 178.8,104.3"/><polygon points="317.4,82.6 282.7,147.3 252.7,117.3"/><polygon points="366,200 295.7,221.2 295.7,178.8"/><polygon points="317.4,317.4 252.7,282.7 282.7,252.7"/><polygon points="200,366 178.8,295.7 221.2,295.7"/><polygon points="82.6,317.4 117.3,252.7 147.3,282.7"/><polygon points="34,200 104.3,178.8 104.3,221.2"/><polygon points="82.6,82.6 147.3,117.3 117.3,147.3"/></g>
<circle cx="200" cy="200" r="110" fill="url(#sph)"/><circle cx="200" cy="200" r="78" fill="#050506"/>
<g fill="none" stroke="#ffffff" stroke-opacity=".22" stroke-width="2"><circle cx="200" cy="200" r="46"/><circle cx="200" cy="200" r="28"/></g>
<circle cx="200" cy="200" r="8" fill="#ffffff"/>
</g>
<text class="wm" x="210" y="112" textLength="440" lengthAdjust="spacing" fill="url(#wmg)">SOLLARETY</text>
<g clip-path="url(#wmc)"><g transform="skewX(-20)"><rect class="sh" x="210" y="52" width="170" height="76" fill="url(#shg)"/></g></g>
<text class="eb" x="214" y="50">DISCORD BOT · C# / .NET</text>
<text class="sub" x="213" y="146">moderation · Roblox verification · music · fun, for Discord</text>
</svg>
