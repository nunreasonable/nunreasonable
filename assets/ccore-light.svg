<svg xmlns="http://www.w3.org/2000/svg" width="860" height="180" viewBox="0 0 860 180" role="img" aria-label="ccore, chavinhoCORE: administration bot for the 12° Regimento de Infantaria">
<title>ccore — chavinhoCORE</title>
<style>
.ti{font:700 32px 'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;fill:#0b1428}
.sub{font:400 15px 'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;fill:#56607a}
.eb{font:600 12px 'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;fill:#b81f2a;letter-spacing:3px}
.au{transform-box:fill-box;transform-origin:center;animation:au 12s ease-in-out infinite alternate}
@keyframes au{0%{opacity:.5;transform:translateX(-20px) scale(.92)}100%{opacity:1;transform:translateX(26px) scale(1.08)}}
.pl{font:600 11px 'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;fill:#0b1428}
.lg{font:500 9px 'Cascadia Code','Cascadia Mono',Consolas,ui-monospace,'SF Mono',Menlo,'DejaVu Sans Mono',monospace;fill:#56607a}
.sh{font:800 17px 'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;fill:#ffffff}
.pd{transform-box:fill-box;transform-origin:center;animation:pd 3.2s ease-in-out infinite}
@keyframes pd{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.pr{transform-box:fill-box;transform-origin:center;animation:pr 3.2s ease-out infinite}
@keyframes pr{0%{opacity:.6;transform:scale(1)}70%,100%{opacity:0;transform:scale(2.6)}}
.pg{animation:pg 6.4s ease-in-out infinite}
@keyframes pg{0%,100%{opacity:.55}50%{opacity:1}}
.rw{animation:rw 12s ease infinite backwards}
@keyframes rw{0%{opacity:0;transform:translateX(-8px)}6%,88%{opacity:1;transform:translateX(0)}96%,100%{opacity:0;transform:translateX(0)}}
.rg{transform-box:fill-box;transform-origin:center;animation:rg 60s linear infinite}
@keyframes rg{to{transform:rotate(360deg)}}
.sg{transform-box:fill-box;transform-origin:center;animation:sg 9s ease-in-out infinite alternate}
@keyframes sg{0%{opacity:.5;transform:scale(.9)}100%{opacity:1;transform:scale(1.1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fafbfd"/><stop offset="1" stop-color="#edf1f8"/></linearGradient>
<pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#0a1430" fill-opacity=".08"/></pattern>
<radialGradient id="glow"><stop offset="0" stop-color="#3b5a96" stop-opacity=".22"/><stop offset="1" stop-color="#3b5a96" stop-opacity="0"/></radialGradient>
<clipPath id="card"><rect width="860" height="180" rx="18"/></clipPath>
<linearGradient id="shf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#24407a"/><stop offset="1" stop-color="#14254a"/></linearGradient>
<radialGradient id="shg"><stop offset="0" stop-color="#d42a35" stop-opacity=".45"/><stop offset="1" stop-color="#d42a35" stop-opacity="0"/></radialGradient>
<clipPath id="shc"><path d="M556 40h52v36c0 22-12 34-26 42-14-8-26-20-26-42z"/></clipPath>
</defs>
<g clip-path="url(#card)">
<rect width="860" height="180" rx="18" fill="url(#bg)"/>
<rect width="860" height="180" fill="url(#dots)"/>
<ellipse class="au" cx="150" cy="70" rx="260" ry="130" fill="url(#glow)"/>
</g>
<rect x=".5" y=".5" width="859" height="179" rx="17.5" fill="none" stroke="rgba(27,42,74,.18)"/>
<text class="eb" x="42" y="58">ADMIN BOT · RUST · 12° RI</text>
<text class="ti" x="40" y="100">ccore — chavinhoCORE</text>
<text class="sub" x="41" y="132">enlistment · Roblox verification · deployments</text>
