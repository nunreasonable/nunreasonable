<path d="M552 36h60v40c0 25-14 38-30 47-16-9-30-22-30-47z" fill="#7d93be"/>
<path d="M556 40h52v36c0 22-12 34-26 42-14-8-26-20-26-42z" fill="url(#shf)"/>
<g clip-path="url(#shc)">
<path d="M556 92l26 14 26-14v8l-26 14-26-14z" fill="#d42a35"/>
<path d="M556 102l26 14 26-14v8l-26 14-26-14z" fill="#d42a35" fill-opacity=".6"/>
<rect x="556" y="40" width="52" height="7" fill="#d42a35"/>
</g>
<text class="sh" x="582" y="80" text-anchor="middle">12°</text>
<g class="rg"><circle cx="582" cy="82" r="56" fill="none" stroke="#7d93be" stroke-opacity=".55" stroke-dasharray="2 6"/></g>
<circle cx="582" cy="82" r="64" fill="none" stroke="#7d93be" stroke-opacity=".25"/>
<g class="pg"><rect x="644" y="44" width="184" height="26" rx="13" fill="rgba(183,121,15,.08)" stroke="rgba(183,121,15,.4)"/></g>
<circle class="pr" cx="660" cy="57" r="4" fill="none" stroke="#b7790f"/>
<circle class="pd" cx="660" cy="57" r="4" fill="#b7790f"/>
<text class="pl" x="672" y="61">fewer updates — not disabled</text>
<g class="rw" style="animation-delay:0.0s"><text class="lg" x="646" y="98"><tspan fill="#b81f2a">›</tspan> enlist</text><path d="M722 94l3 3 6-6" fill="none" stroke="#1f8a4c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text class="lg" x="736" y="98">roblox verified</text></g><g class="rw" style="animation-delay:0.8s"><text class="lg" x="646" y="113"><tspan fill="#b81f2a">›</tspan> deploy</text><path d="M722 109l3 3 6-6" fill="none" stroke="#1f8a4c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text class="lg" x="736" y="113">posted</text></g><g class="rw" style="animation-delay:1.6s"><text class="lg" x="646" y="128"><tspan fill="#b81f2a">›</tspan> sheet</text><path d="M722 124l3 3 6-6" fill="none" stroke="#1f8a4c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text class="lg" x="736" y="128">synced</text></g><g class="rw" style="animation-delay:2.4s"><text class="lg" x="646" y="143"><tspan fill="#b81f2a">›</tspan> announce</text><path d="M722 139l3 3 6-6" fill="none" stroke="#1f8a4c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text class="lg" x="736" y="143">sent</text></g>
