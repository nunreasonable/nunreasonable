<rect x="668" y="74" width="64" height="4" rx="2" fill="rgba(6,40,36,.13)"/><rect x="668" y="84" width="44" height="4" rx="2" fill="rgba(6,40,36,.13)"/><rect x="668" y="94" width="72" height="4" rx="2" fill="rgba(6,40,36,.13)"/>
<rect x="766" y="56" width="62" height="78" rx="6" fill="#fbfefd" stroke="rgba(6,40,36,.14)"/><circle cx="774" cy="63" r="2" fill="#0d8073"/>
<circle cx="797" cy="92" r="13" fill="#0d8073" fill-opacity=".3"/><rect x="777" y="112" width="40" height="4" rx="2" fill="rgba(6,40,36,.13)"/>
</g>
<g class="qb"><rect x="656" y="28" width="176" height="18" rx="6" fill="rgba(251,254,253,.9)" stroke="rgba(6,40,36,.14)"/>
<rect x="663" y="34" width="10" height="6" rx="3" fill="#0d8073"/><g fill="rgba(6,40,36,.36)"><circle cx="680" cy="37" r="2.6"/><circle cx="688" cy="37" r="2.6"/><circle cx="696" cy="37" r="2.6"/></g>
<text class="bt" x="744" y="40" text-anchor="middle">12:00</text>
