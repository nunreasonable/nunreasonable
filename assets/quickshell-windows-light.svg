<rect x="652" y="142" width="184" height="14" fill="rgba(251,254,253,.8)"/>
<g fill="rgba(6,40,36,.36)"><rect x="724" y="145" width="8" height="8" rx="2"/><rect x="736" y="145" width="8" height="8" rx="2" fill="#0d8073"/><rect x="748" y="145" width="8" height="8" rx="2"/><rect x="760" y="145" width="8" height="8" rx="2"/></g>
