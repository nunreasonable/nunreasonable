<g class="cg"><text class="ln" x="502" y="52">1</text><text class="cd" xml:space="preserve" x="518" y="52" clip-path="url(#c0)"><tspan fill="#0d8073">PanelWindow</tspan> {</text><text class="ln" x="502" y="65">2</text><text class="cd" xml:space="preserve" x="518" y="65" clip-path="url(#c1)">  anchors.top: <tspan fill="#b25f00">true</tspan></text><text class="ln" x="502" y="78">3</text><text class="cd" xml:space="preserve" x="518" y="78" clip-path="url(#c2)">  implicitHeight: <tspan fill="#b25f00">24</tspan></text><text class="ln" x="502" y="91">4</text><text class="cd" xml:space="preserve" x="518" y="91" clip-path="url(#c3)">  <tspan fill="#0d8073">Clock</tspan> {}</text><text class="ln" x="502" y="104">5</text><text class="cd" xml:space="preserve" x="518" y="104" clip-path="url(#c4)">}</text></g>
<rect x="500" y="122" width="134" height="1" fill="rgba(6,40,36,.13)"/>
<text class="ps" x="502" y="141"><tspan fill="#0d8073">&gt;</tspan> qs -c bar</text>
<g class="run"><circle cx="624" cy="138" r="3" fill="#0d8073"/></g>
