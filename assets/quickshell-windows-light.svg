<svg xmlns="http://www.w3.org/2000/svg" width="860" height="180" viewBox="0 0 860 180" role="img" aria-label="quickshell-windows: Quickshell running natively on Windows 11 and 10">
<title>quickshell-windows</title>
<style>
.ti{font:700 34px 'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;fill:#06201d}
.sub{font:400 15px 'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;fill:#53625f}
.eb{font:600 12px 'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;fill:#0d8073;letter-spacing:3px}
.au{transform-box:fill-box;transform-origin:center;animation:au 12s ease-in-out infinite alternate}
@keyframes au{0%{opacity:.5;transform:translateX(-20px) scale(.92)}100%{opacity:1;transform:translateX(26px) scale(1.08)}}
.cd{font:500 9px 'Cascadia Code','Cascadia Mono',Consolas,ui-monospace,'SF Mono',Menlo,'DejaVu Sans Mono',monospace;fill:#173532;white-space:pre}
.ln{font:500 9px 'Cascadia Code','Cascadia Mono',Consolas,ui-monospace,'SF Mono',Menlo,'DejaVu Sans Mono',monospace;fill:rgba(6,40,36,.36)}
.ps{font:600 9px 'Cascadia Code','Cascadia Mono',Consolas,ui-monospace,'SF Mono',Menlo,'DejaVu Sans Mono',monospace;fill:#173532}
.bt{font:600 8px 'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;fill:#173532}
.ty{transform-box:fill-box;transform-origin:0 0;transform:scaleX(1)}
.cg{animation:cg 9s linear infinite}
@keyframes cg{0%,90%{opacity:1}96%,100%{opacity:0}}
.qb{animation:qb 9s cubic-bezier(.2,.8,.2,1) infinite}
@keyframes qb{0%,44%{transform:translateY(-26px)}50%,90%{transform:translateY(0)}97%,100%{transform:translateY(-26px)}}
.dw{animation:dw 9s cubic-bezier(.2,.8,.2,1) infinite}
@keyframes dw{0%,45%{transform:translateY(-20px)}52%,90%{transform:translateY(0)}97%,100%{transform:translateY(-20px)}}
.run{animation:run 9s steps(1) infinite}
@keyframes run{0%,37%{opacity:0}38%,100%{opacity:1}}
.cur{animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.t0{animation:t0 9s steps(13,end) infinite}
@keyframes t0{0%,3%{transform:scaleX(0)}8%,100%{transform:scaleX(1)}}
.t1{animation:t1 9s steps(19,end) infinite}
@keyframes t1{0%,9%{transform:scaleX(0)}14%,100%{transform:scaleX(1)}}
.t2{animation:t2 9s steps(20,end) infinite}
@keyframes t2{0%,15%{transform:scaleX(0)}20%,100%{transform:scaleX(1)}}
.t3{animation:t3 9s steps(10,end) infinite}
@keyframes t3{0%,21%{transform:scaleX(0)}26%,100%{transform:scaleX(1)}}
.t4{animation:t4 9s steps(2,end) infinite}
@keyframes t4{0%,27%{transform:scaleX(0)}32%,100%{transform:scaleX(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f9fcfc"/><stop offset="1" stop-color="#ecf4f3"/></linearGradient>
<pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#062421" fill-opacity=".08"/></pattern>
<radialGradient id="glow"><stop offset="0" stop-color="#2fd6c0" stop-opacity=".26"/><stop offset="1" stop-color="#2fd6c0" stop-opacity="0"/></radialGradient>
<clipPath id="card"><rect width="860" height="180" rx="18"/></clipPath>
<linearGradient id="wp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d4f3ee"/><stop offset=".6" stop-color="#9fe0d6"/><stop offset="1" stop-color="#3fb3a3"/></linearGradient>
<clipPath id="dsk"><rect x="652" y="24" width="184" height="132" rx="10"/></clipPath>
<clipPath id="c0"><rect class="ty t0" x="518" y="43" width="72.2" height="12"/></clipPath><clipPath id="c1"><rect class="ty t1" x="518" y="56" width="104.6" height="12"/></clipPath><clipPath id="c2"><rect class="ty t2" x="518" y="69" width="110" height="12"/></clipPath><clipPath id="c3"><rect class="ty t3" x="518" y="82" width="56" height="12"/></clipPath><clipPath id="c4"><rect class="ty t4" x="518" y="95" width="7.4" height="12"/></clipPath>
</defs>
<g clip-path="url(#card)">
<rect width="860" height="180" rx="18" fill="url(#bg)"/>
<rect width="860" height="180" fill="url(#dots)"/>
<ellipse class="au" cx="150" cy="70" rx="260" ry="130" fill="url(#glow)"/>
</g>
<rect x=".5" y=".5" width="859" height="179" rx="17.5" fill="none" stroke="rgba(13,128,115,.2)"/>
<text class="eb" x="42" y="58">QUICKSHELL · WINDOWS 11 &amp; 10 · QT 6</text>
<text class="ti" x="40" y="100">quickshell-windows</text>
