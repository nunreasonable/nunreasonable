<svg xmlns="http://www.w3.org/2000/svg" width="900" height="6" viewBox="0 0 900 6" role="img" aria-label="divider">
<style>.hl{animation:hl 5s cubic-bezier(.45,0,.2,1) infinite}@keyframes hl{0%{transform:translateX(-200px)}100%{transform:translateX(1100px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs>
<linearGradient id="l" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff2d62" stop-opacity="0"/><stop offset=".5" stop-color="#ff2d62"/><stop offset="1" stop-color="#ff2d62" stop-opacity="0"/></linearGradient>
<linearGradient id="h" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb3c6" stop-opacity="0"/><stop offset=".5" stop-color="#ffd9e2"/><stop offset="1" stop-color="#ffb3c6" stop-opacity="0"/></linearGradient>
<radialGradient id="g"><stop offset="0" stop-color="#ff2d62" stop-opacity=".45"/><stop offset="1" stop-color="#ff2d62" stop-opacity="0"/></radialGradient>
<clipPath id="c"><rect width="900" height="6"/></clipPath>
</defs>
<g clip-path="url(#c)">
<ellipse cx="450" cy="3" rx="300" ry="3" fill="url(#g)"/>
<rect y="2" width="900" height="2" rx="1" fill="url(#l)"/>
<g class="hl"><rect x="-120" y="2" width="120" height="2" fill="url(#h)"/></g>
</g>
</svg>
