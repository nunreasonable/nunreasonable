<path d="M478 70 C 519.0 70, 519.0 90, 560 90 C 601.0 90, 601.0 70, 642 70 C 683.0 70, 683.0 90, 724 90 C 765.0 90, 765.0 70, 806 70" fill="none" stroke="#d7b56d" stroke-opacity=".35" stroke-width="2" stroke-dasharray="5 5"/>
<path class="route" d="M478 70 C 519.0 70, 519.0 90, 560 90 C 601.0 90, 601.0 70, 642 70 C 683.0 70, 683.0 90, 724 90 C 765.0 90, 765.0 70, 806 70" pathLength="1" fill="none" stroke="#d7b56d" stroke-width="2" stroke-dasharray="1" stroke-dashoffset="0"/>
<g class="st" style="animation-delay:0.35s"><circle cx="478" cy="70" r="11" fill="#2a1517" stroke="#d7b56d" stroke-width="2"/><text class="n" x="478" y="74" text-anchor="middle">1</text><text class="cm" x="478" y="104" text-anchor="middle">/alistar-se</text><text class="lb" x="478" y="118" text-anchor="middle">enlist</text></g><g class="st" style="animation-delay:0.80s"><circle cx="560" cy="90" r="11" fill="#2a1517" stroke="#d7b56d" stroke-width="2"/><text class="n" x="560" y="94" text-anchor="middle">2</text><text class="cm" x="560" y="120" text-anchor="middle">/deployment</text><text class="lb" x="560" y="134" text-anchor="middle">called up</text></g><g class="st" style="animation-delay:1.25s"><circle cx="642" cy="70" r="11" fill="#2a1517" stroke="#d7b56d" stroke-width="2"/><text class="n" x="642" y="74" text-anchor="middle">3</text><text class="cm" x="642" y="104" text-anchor="middle">/audit-add</text><text class="lb" x="642" y="118" text-anchor="middle">on record</text></g><g class="st" style="animation-delay:1.70s"><circle cx="724" cy="90" r="11" fill="#2a1517" stroke="#d7b56d" stroke-width="2"/><text class="n" x="724" y="94" text-anchor="middle">4</text><text class="cm" x="724" y="120" text-anchor="middle">/audit-push</text><text class="lb" x="724" y="134" text-anchor="middle">published</text></g><g class="st" style="animation-delay:2.15s"><circle cx="806" cy="70" r="11" fill="#2a1517" stroke="#d7b56d" stroke-width="2"/><text class="n" x="806" y="74" text-anchor="middle">5</text><text class="cm" x="806" y="104" text-anchor="middle">/promocoes</text><text class="lb" x="806" y="118" text-anchor="middle">moves up</text></g>
