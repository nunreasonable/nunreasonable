<image x="26" y="24" width="132" height="132" href="data:image/webp;base64,"/>
<circle class="ring" cx="92" cy="90" r="68" fill="none" stroke="#d7b56d" stroke-width="2"/>
<text class="eb" x="186" y="56">ADMIN BOT · RUST · 12° RI</text>
<text class="ti" x="183" y="102">ccore</text>
