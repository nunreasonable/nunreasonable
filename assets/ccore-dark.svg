<svg xmlns="http://www.w3.org/2000/svg" width="860" height="180" viewBox="0 0 860 180" role="img" aria-label="ccore: administration bot for the 12° Regimento de Infantaria Chaves">
<title>ccore</title>
<style>
.eb{font:600 12px 'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;fill:#d7b56d;letter-spacing:3px}
.ti{font:700 44px 'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;fill:#f1e6da;letter-spacing:-1.5px}
.sub{font:400 15px 'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;fill:#b39a8e}
.ps{font:500 12px 'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;fill:#b39a8e}
.n{font:700 11px 'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;fill:#f1e6da}
.cm{font:600 10px 'Cascadia Code','Cascadia Mono',Consolas,ui-monospace,'SF Mono',Menlo,'DejaVu Sans Mono',monospace;fill:#f1e6da}
.lb{font:400 10px 'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;fill:#b39a8e}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 7s ease-out infinite}
@keyframes ring{0%,62%{opacity:0;transform:scale(.92)}68%{opacity:.75;transform:scale(.97)}100%{opacity:0;transform:scale(1.2)}}
.route{animation:route 7s ease-in-out infinite}
@keyframes route{0%{stroke-dashoffset:1}38%,86%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.st{animation:st 7s ease-out infinite backwards}
@keyframes st{0%{opacity:0}6%,86%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.ring{opacity:0}}
</style>
<defs><clipPath id="card"><rect width="860" height="180" rx="18"/></clipPath></defs>
<rect width="860" height="180" rx="18" fill="#1e0e10"/>
