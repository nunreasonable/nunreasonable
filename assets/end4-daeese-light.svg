<text class="hd" x="682" y="56">CYBERDECK</text><rect x="682" y="64" width="120" height="3" fill="rgba(40,8,20,.16)"/><rect x="682" y="72" width="90" height="3" fill="rgba(40,8,20,.16)"/>
<rect x="682" y="80" width="138" height="8" fill="none" stroke="#b3002a"/><rect x="683" y="81" width="92" height="6" fill="#d4002f" fill-opacity=".8"/>
