<svg xmlns="http://www.w3.org/2000/svg" width="860" height="180" viewBox="0 0 860 180" role="img" aria-label="end4-daeese: a personal Hyprland and Quickshell setup">
<title>end4-daeese</title>
<style>
.ti{font:700 34px 'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;fill:#16080e}
.sub{font:400 15px 'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;fill:#5e5559}
.eb{font:600 12px 'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;fill:#c8002f;letter-spacing:3px}
.au{transform-box:fill-box;transform-origin:center;animation:au 12s ease-in-out infinite alternate}
@keyframes au{0%{opacity:.5;transform:translateX(-20px) scale(.92)}100%{opacity:1;transform:translateX(26px) scale(1.08)}}
.tt{font:600 7.5px 'Cascadia Code','Cascadia Mono',Consolas,ui-monospace,'SF Mono',Menlo,'DejaVu Sans Mono',monospace;fill:#1a0a10}
.hd{font:700 7.5px 'Cascadia Code','Cascadia Mono',Consolas,ui-monospace,'SF Mono',Menlo,'DejaVu Sans Mono',monospace;fill:#d4002f;letter-spacing:1px}
.fc{opacity:0;animation:fc 8s steps(1) infinite}
@keyframes fc{0%,24.9%{opacity:1}25%,100%{opacity:0}}
.gl{opacity:0;animation:gl 8s steps(1) infinite}
@keyframes gl{0%,24.4%{opacity:0}24.5%{opacity:1;transform:translateX(-3px)}25.2%{opacity:1;transform:translateX(2px)}25.8%,49.4%{opacity:0}49.5%{opacity:1;transform:translateX(3px)}50.2%,100%{opacity:0}}
.cur{animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.f0{opacity:1}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf9fa"/><stop offset="1" stop-color="#f3eef1"/></linearGradient>
<pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#2a0a16" fill-opacity=".09"/></pattern>
<radialGradient id="glow"><stop offset="0" stop-color="#ff003c" stop-opacity=".18"/><stop offset="1" stop-color="#ff003c" stop-opacity="0"/></radialGradient>
<clipPath id="card"><rect width="860" height="180" rx="18"/></clipPath>
<linearGradient id="fg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d4002f"/><stop offset="1" stop-color="#5a0014"/></linearGradient>
<linearGradient id="dk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdfbfc"/><stop offset="1" stop-color="#f5e9ed"/></linearGradient>
<pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="rgba(90,0,20,.035)"/></pattern>
<clipPath id="pn"><path d="M504 20H836V148L824 160H492V32Z"/></clipPath>
</defs>
<g clip-path="url(#card)">
<rect width="860" height="180" rx="18" fill="url(#bg)"/>
<rect width="860" height="180" fill="url(#dots)"/>
<ellipse class="au" cx="150" cy="70" rx="260" ry="130" fill="url(#glow)"/>
</g>
<rect x=".5" y=".5" width="859" height="179" rx="17.5" fill="none" stroke="rgba(179,0,42,.2)"/>
