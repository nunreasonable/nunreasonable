<rect x="492" y="20" width="344" height="140" fill="#0c0a14"/>
<rect x="492" y="20" width="344" height="18" fill="rgba(255,255,255,.05)"/>
<circle cx="504" cy="29" r="2.4" fill="#b7abf0"/><circle cx="512" cy="29" r="2.4" fill="rgba(220,216,238,.4)"/><circle cx="520" cy="29" r="2.4" fill="rgba(220,216,238,.4)"/>
<text class="tb" x="664" y="32" text-anchor="middle">root — emerge</text>
<g class="all">
<text class="tm" x="506" y="54" clip-path="url(#cc)"><tspan fill="#ef6b73">#</tspan> emerge -a rosemary ginrose mocktail-bin</text>
<g class="l0"><text class="tm" x="506" y="72"><tspan fill="#7fd18b">&gt;&gt;&gt;</tspan> (1 of 3) app-emulation/rosemary-0.4.1<tspan fill="rgba(220,216,238,.4)">::rosemary</tspan></text></g><g class="s0"><circle cx="820" cy="69" r="3.5" fill="none" stroke="rgba(220,216,238,.4)" stroke-width="1.4" stroke-dasharray="11 11"/></g><g class="k0"><path d="M815.5 69l3 3 5.5-6" fill="none" stroke="#7fd18b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><g class="l1"><text class="tm" x="506" y="87"><tspan fill="#7fd18b">&gt;&gt;&gt;</tspan> (2 of 3) games-util/ginrose-0.3.5<tspan fill="rgba(220,216,238,.4)">::rosemary</tspan></text></g><g class="s1"><circle cx="820" cy="84" r="3.5" fill="none" stroke="rgba(220,216,238,.4)" stroke-width="1.4" stroke-dasharray="11 11"/></g><g class="k1"><path d="M815.5 84l3 3 5.5-6" fill="none" stroke="#7fd18b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><g class="l2"><text class="tm" x="506" y="102"><tspan fill="#7fd18b">&gt;&gt;&gt;</tspan> (3 of 3) app-emulation/mocktail-bin-1.0.4<tspan fill="rgba(220,216,238,.4)">::mocktail</tspan></text></g><g class="s2"><circle cx="820" cy="99" r="3.5" fill="none" stroke="rgba(220,216,238,.4)" stroke-width="1.4" stroke-dasharray="11 11"/></g><g class="k2"><path d="M815.5 99l3 3 5.5-6" fill="none" stroke="#7fd18b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="jb"><text class="tm" x="506" y="126"><tspan fill="#7fd18b">&gt;&gt;&gt;</tspan> <tspan fill="#b7abf0">Jobs: 3 of 3 complete</tspan></text>
<text class="tm" x="506" y="146"><tspan fill="#ef6b73">#</tspan></text><rect class="cur" x="514" y="138" width="5.5" height="10" fill="#dcd8ee"/></g>
</g>
</g>
<rect x="492.5" y="20.5" width="343" height="139" rx="11.5" fill="none" stroke="rgba(255,255,255,.12)"/>
